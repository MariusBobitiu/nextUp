server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets when available
    gzip_static on;

    # Cache hashed static assets for 1 year
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other routes fall back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
